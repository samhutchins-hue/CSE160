<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Change a point color</title>
  </head>

  <link rel="icon" href="data:," />
  <p>Sam Hutchins</p>
  <p>sthutchi@ucsc.edu</p>
  <p>Notes to Grader: click canvas to lock pointer</p>
  <p>backtracking iterative dfs maze generated map</p>

  <body onload="main()">
    <canvas id="webgl" width="400" height="400">
      Please use a browser that supports "canvas"
    </canvas>

    <p id="numdot">XXX</p>
    <p>
      <button id="normalOn">normal on</button>
      <button id="normalOff">normal off</button>
    </p>
    <p>
      light slider x
      <input
        type="range"
        id="lightSliderX"
        name="segment"
        value="0"
        min="0"
        max="100"
        step="1"
      />
    </p>
    <p>
      light slider y
      <input
        type="range"
        id="lightSliderY"
        name="segment"
        value="0"
        min="0"
        max="100"
        step="1"
      />
    </p>
    <p>
      light slider z
      <input
        type="range"
        id="lightSliderZ"
        name="segment"
        value="0"
        min="0"
        max="100"
        step="1"
      />
    </p>
    <script src="lib/webgl-utils.js"></script>
    <script src="lib/webgl-debug.js"></script>
    <script src="lib/cuon-utils.js"></script>
    <script src="lib/cuon-matrix-cse160.js"></script>
    <script src="Camera.js"></script>
    <script src="asgn4.js"></script>
    <script src="Triangle.js"></script>
    <script src="Cube.js"></script>
    <script src="Cone.js"></script>
    <script src="Map.js"></script>
    <script src="Sphere.js"></script>
  </body>
</html>
